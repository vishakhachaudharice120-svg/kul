<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clan & Surname Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --border: #e3e8ef;
      --text: #0f172a;
      --muted: #5b6474;
      --accent: #2563eb;
      --accent-2: #14b8a6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Manrope", "Segoe UI", sans-serif;
      background: radial-gradient(circle at 80% 10%, rgba(37, 99, 235, 0.08), transparent 35%),
                  radial-gradient(circle at 10% 20%, rgba(20, 184, 166, 0.08), transparent 35%),
                  var(--bg);
      color: var(--text);
      padding: 32px 18px 48px;
    }

    .shell {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      letter-spacing: -0.02em;
    }

    p.lead {
      margin: 0;
      color: var(--muted);
      max-width: 720px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    label { display: block; font-weight: 700; margin-bottom: 10px; }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
      background: #fff;
    }

    .suggestions {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .pill {
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f8fafc;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      text-align: center;
      font-weight: 700;
    }

    .pill:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: #edf2ff;
    }

    .pill.is-active {
      border-color: var(--accent);
      background: #dbeafe;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .meta-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      background: #f8fafc;
    }

    .meta-item strong { display: block; margin-bottom: 6px; color: var(--accent); }

    .surnames {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 9px 12px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: #f8fafc;
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease, color 120ms ease;
      font-weight: 700;
      font-size: 14px;
    }

    .chip:hover {
      border-color: var(--accent);
      background: #edf2ff;
    }

    .chip.is-active {
      border-color: var(--accent);
      background: #2563eb;
      color: #fff;
    }

    .empty { color: var(--muted); margin-top: 8px; }

    .tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tab {
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab.is-active {
      border-color: var(--accent);
      background: #dbeafe;
      color: #0b3aa8;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:hover {
      border-color: var(--accent);
      background: #edf2ff;
    }

    @media (max-width: 640px) {
      .input-row { flex-direction: column; align-items: stretch; }
      .actions { justify-content: stretch; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useMemo, useState, useEffect } = React;

    const charMap = {
      "अ": "a", "आ": "aa", "इ": "i", "ई": "ee", "उ": "u", "ऊ": "oo",
      "ए": "e", "ऐ": "ai", "ओ": "o", "औ": "au", "ऋ": "ri", "ॠ": "rri", "ं": "n", "ः": "h",
      "क": "k", "ख": "kh", "ग": "g", "घ": "gh", "ङ": "n",
      "च": "ch", "छ": "chh", "ज": "j", "झ": "jh", "ञ": "ny",
      "ट": "t", "ठ": "th", "ड": "d", "ढ": "dh", "ण": "n",
      "त": "t", "थ": "th", "द": "d", "ध": "dh", "न": "n",
      "प": "p", "फ": "ph", "ब": "b", "भ": "bh", "म": "m",
      "य": "y", "र": "r", "ल": "l", "व": "v",
      "श": "sh", "ष": "sh", "स": "s", "ह": "h",
      "ळ": "l", "क्ष": "ksh", "ज्ञ": "gy", "ज़": "z", "फ़": "f", "क़": "q"
    };


    const transliterate = (text = "") =>
      Array.from(text)
        .map((ch) => charMap[ch] ?? ch)
        .join("")
        .toLowerCase();

    const useSorted = (arr) => useMemo(() => [...arr].sort((a, b) => a.localeCompare(b)), [arr]);

    function App() {
      const [embeddedData, setEmbeddedData] = useState([]);
      const [activeTab, setActiveTab] = useState("clan");
      const [clanQuery, setClanQuery] = useState("");
      const [selectedClan, setSelectedClan] = useState(null);
      const [selectedSurname, setSelectedSurname] = useState("");
      const [surnameQuery, setSurnameQuery] = useState("");
      const [globalSurnameQuery, setGlobalSurnameQuery] = useState("");
      const [selectedGlobalSurname, setSelectedGlobalSurname] = useState("");

      // Fetch data from data.json on component mount
      useEffect(() => {
        fetch("data.json")
          .then((response) => response.json())
          .then((data) => setEmbeddedData(data))
          .catch((error) => console.error("Error loading data:", error));
      }, []);

      const clanMatches = useMemo(() => {
        const q = clanQuery.trim().toLowerCase();
        if (!q) return [];
        return embeddedData.filter((item) => {
          const native = (item["Clan Name"] || "").toLowerCase();
          const latin = transliterate(item["Clan Name"]);
          return native.startsWith(q) || latin.startsWith(q);
        });
      }, [clanQuery, embeddedData]);

      const surnames = useSorted(selectedClan?.Surnames || []);

      const surnameMatches = useMemo(() => {
        if (!selectedClan) return [];
        const q = surnameQuery.trim().toLowerCase();
        if (!q) return surnames;
        return surnames.filter((name) => {
          const native = name.toLowerCase();
          const latin = transliterate(name);
          return native.startsWith(q) || latin.startsWith(q);
        });
      }, [selectedClan, surnameQuery, surnames]);

      const globalSurnameSuggestions = useMemo(() => {
        const q = globalSurnameQuery.trim().toLowerCase();
        if (!q) return [];
        const unique = new Set();
        embeddedData.forEach((clan) => {
          (clan.Surnames || []).forEach((name) => {
            const native = name.toLowerCase();
            const latin = transliterate(name);
            if (native.startsWith(q) || latin.startsWith(q)) {
              unique.add(name);
            }
          });
        });
        return Array.from(unique).sort((a, b) => a.localeCompare(b));
      }, [globalSurnameQuery, embeddedData]);

      const globalSurnameMatches = useMemo(() => {
        if (!selectedGlobalSurname) return [];
        return embeddedData.filter((clan) =>
          (clan.Surnames || []).includes(selectedGlobalSurname)
        );
      }, [selectedGlobalSurname, embeddedData]);

      const handleClanSelect = (clan) => {
        setSelectedClan(clan);
        setSelectedSurname("");
        setSurnameQuery("");
      };

      const handleSurnameSelect = (surname) => setSelectedSurname(surname);

      const clearClanFlow = () => {
        setClanQuery("");
        setSelectedClan(null);
        setSelectedSurname("");
        setSurnameQuery("");
      };

      const clearSurnameFlow = () => {
        setGlobalSurnameQuery("");
        setSelectedGlobalSurname("");
      };

      return (
        <div className="shell">
          <header>
            <h1>Clan &amp; Surname Finder</h1>
            <p className="lead">Type the first letter in English or Marathi; pick a clan, then explore surnames and full details.</p>
          </header>

          <div className="card">
            <div className="tabs">
              <button
                type="button"
                className={`tab ${activeTab === "clan" ? "is-active" : ""}`}
                onClick={() => setActiveTab("clan")}
              >
                Search by Clan + Surname
              </button>
              <button
                type="button"
                className={`tab ${activeTab === "surname" ? "is-active" : ""}`}
                onClick={() => setActiveTab("surname")}
              >
                Search by Surname
              </button>
            </div>
          </div>

          {activeTab === "clan" && (
          <div className="card">
            <label htmlFor="clan-input">Search by clan</label>
            <div className="input-row">
              <input
                id="clan-input"
                type="text"
                placeholder="e.g. a"
                value={clanQuery}
                onChange={(e) => setClanQuery(e.target.value)}
              />
            </div>
            {clanQuery && (
              <div className="suggestions">
                {clanMatches.length === 0 && <div className="empty">No clans match that prefix.</div>}
                {clanMatches.map((item) => (
                  <div
                    key={item["Serial Number"]}
                    className={`pill ${selectedClan?.["Serial Number"] === item["Serial Number"] ? "is-active" : ""}`}
                    onClick={() => handleClanSelect(item)}
                    role="button"
                  >
                    {item["Clan Name"]}
                  </div>
                ))}
              </div>
            )}
            <div className="actions">
              <button type="button" className="btn" onClick={clearClanFlow}>
                Clear
              </button>
            </div>
          </div>
          )}

          {activeTab === "clan" && selectedClan && (
            <div className="card">
              <strong>Surnames in {selectedClan["Clan Name"]}</strong>
              <div className="input-row" style={{ marginTop: 10 }}>
                <input
                  type="text"
                  placeholder="Search surnames in this clan (English or Marathi)"
                  value={surnameQuery}
                  onChange={(e) => setSurnameQuery(e.target.value)}
                />
              </div>
              <div className="surnames">
                {surnameMatches.map((name) => (
                  <div
                    key={name}
                    className={`chip ${selectedSurname === name ? "is-active" : ""}`}
                    onClick={() => handleSurnameSelect(name)}
                    role="button"
                  >
                    {name}
                  </div>
                ))}
              </div>
              {surnameMatches.length === 0 && <div className="empty">No surnames match that prefix in this clan.</div>}
              {surnames.length === 0 && <div className="empty">No surnames listed for this clan.</div>}
              {!selectedSurname && surnameMatches.length > 0 && (
                <div className="empty">Pick a surname to see clan details.</div>
              )}
            </div>
          )}

          {activeTab === "clan" && selectedClan && selectedSurname && (
            <div className="card">
              <strong>Details</strong>
              <div className="meta">
                <div className="meta-item">
                  <strong>Clan Name</strong>
                  <div>{selectedClan["Clan Name"]}</div>
                </div>
                <div className="meta-item">
                  <strong>Lineage</strong>
                  <div>{selectedClan["Lineage"]}</div>
                </div>
                <div className="meta-item">
                  <strong>Gotra</strong>
                  <div>{selectedClan["Gotra"]}</div>
                </div>
                <div className="meta-item">
                  <strong>Clan Deity</strong>
                  <div>{selectedClan["Clan Deity"]}</div>
                </div>
                <div className="meta-item">
                  <strong>Clan Goddess</strong>
                  <div>{selectedClan["Clan Goddess"]}</div>
                </div>
                <div className="meta-item">
                  <strong>Totem</strong>
                  <div>{selectedClan["Totem"]}</div>
                </div>
                <div className="meta-item">
                  <strong>Selected Surname</strong>
                  <div>{selectedSurname}</div>
                </div>
              </div>
            </div>
          )}

          {activeTab === "surname" && (
            <div className="card">
              <label htmlFor="surname-global-input">Search by surname</label>
              <div className="input-row">
                <input
                  id="surname-global-input"
                  type="text"
                  placeholder="Type surname in English or Marathi"
                  value={globalSurnameQuery}
                  onChange={(e) => {
                    setGlobalSurnameQuery(e.target.value);
                    setSelectedGlobalSurname("");
                  }}
                />
              </div>
              {globalSurnameQuery && (
                <div className="suggestions">
                  {globalSurnameSuggestions.length === 0 && (
                    <div className="empty">No surname suggestions found.</div>
                  )}
                  {globalSurnameSuggestions.map((name) => (
                    <div
                      key={name}
                      className={`pill ${selectedGlobalSurname === name ? "is-active" : ""}`}
                      onClick={() => setSelectedGlobalSurname(name)}
                      role="button"
                    >
                      {name}
                    </div>
                  ))}
                </div>
              )}
              <div className="actions">
                <button type="button" className="btn" onClick={clearSurnameFlow}>
                  Clear
                </button>
              </div>
            </div>
          )}

          {activeTab === "surname" && selectedGlobalSurname && globalSurnameMatches.length === 0 && (
            <div className="card">
              <div className="empty">No clan has this selected surname.</div>
            </div>
          )}

          {activeTab === "surname" && selectedGlobalSurname && globalSurnameMatches.map((clan) => (
            <div className="card" key={clan["Serial Number"]}>
              <strong>{clan["Clan Name"]}</strong>
              <div className="surnames">
                <div className="chip is-active">{selectedGlobalSurname}</div>
              </div>
              <div className="meta">
                <div className="meta-item">
                  <strong>Clan Name</strong>
                  <div>{clan["Clan Name"]}</div>
                </div>
                <div className="meta-item">
                  <strong>Lineage</strong>
                  <div>{clan["Lineage"]}</div>
                </div>
                <div className="meta-item">
                  <strong>Gotra</strong>
                  <div>{clan["Gotra"]}</div>
                </div>
                <div className="meta-item">
                  <strong>Clan Deity</strong>
                  <div>{clan["Clan Deity"]}</div>
                </div>
                <div className="meta-item">
                  <strong>Clan Goddess</strong>
                  <div>{clan["Clan Goddess"]}</div>
                </div>
                <div className="meta-item">
                  <strong>Totem</strong>
                  <div>{clan["Totem"]}</div>
                </div>
                <div className="meta-item">
                  <strong>Selected Surname</strong>
                  <div>{selectedGlobalSurname}</div>
                </div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
